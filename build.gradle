plugins {
    id "base"
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
}

ext.targets = [
    "1.21.11": [
        minecraft: "1.21.11",
        javaVersion: 21,
        mixinJava: "JAVA_21",
        fabricApi: "0.141.4+1.21.11",
        fabricApiMin: "0.141.4",
        modMenu: "17.0.1-beta.1",
        clothConfig: "21.11.153",
        libGui: "15.1.0+1.21.11",
        minecraftRange: "~1.21.11",
        remapped: true
    ],
    "26.1.2": [
        minecraft: "26.1.2",
        javaVersion: 25,
        mixinJava: "JAVA_25",
        fabricApi: "0.151.0+26.1.2",
        fabricApiMin: "0.151.0",
        modMenu: "18.0.0",
        clothConfig: "26.1.154",
        libGui: "16.0.1+26.1",
        minecraftRange: "~26.1.2",
        remapped: false
    ],
    "26.2": [
        minecraft: "26.2",
        javaVersion: 25,
        mixinJava: "JAVA_25",
        fabricApi: "0.152.2+26.2",
        fabricApiMin: "0.152.2",
        modMenu: "20.0.1",
        clothConfig: "26.2.155",
        libGui: "17.0.0+26.2",
        minecraftRange: "~26.2",
        remapped: false
    ]
]

tasks.register("buildAll") {
    group = "build"
    description = "Builds every supported Fabric target."
    dependsOn(
        ":versions:fabric-1.21.11:build",
        ":versions:fabric-26.1.2:build",
        ":versions:fabric-26.2:build"
    )
}

tasks.register("checkAll") {
    group = "verification"
    description = "Checks every supported Fabric target."
    dependsOn(
        ":versions:fabric-1.21.11:check",
        ":versions:fabric-26.1.2:check",
        ":versions:fabric-26.2:check"
    )
}

tasks.named("build") {
    dependsOn("buildAll")
}

tasks.named("check") {
    dependsOn("checkAll")
}
