plugins {
    id "base"
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
}

ext.targets = [
    "1.21.11": [
        minecraft: "1.21.11",
        javaVersion: 21,
        mixinJava: "JAVA_21",
        fabricApi: "0.141.4+1.21.11",
        fabricApiMin: "0.141.4",
        modMenu: "17.0.1-beta.1",
        clothConfig: "21.11.153",
        libGui: "15.1.0+1.21.11",
        minecraftRange: "~1.21.11"
    ]
]

tasks.register("buildAll") {
    group = "build"
    description = "Builds every supported Fabric target."
    dependsOn(":versions:fabric-1.21.11:build")
}

tasks.register("checkAll") {
    group = "verification"
    description = "Checks every supported Fabric target."
    dependsOn(":versions:fabric-1.21.11:check")
}

tasks.named("build") {
    dependsOn("buildAll")
}

tasks.named("check") {
    dependsOn("checkAll")
}
