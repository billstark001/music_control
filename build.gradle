plugins {
    id "base"
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
}

apply from: rootProject.file("gradle/targets.gradle")

def fabricProjectPaths = targets.keySet().collect { ":versions:fabric-${it}" }

tasks.register("cleanIdeaRunConfigurations", Delete) {
    group = "ide"
    description = "Deletes generated Fabric run configurations before IDEA recreates them."
    delete fileTree(rootProject.file(".idea/runConfigurations")) {
        include "Minecraft_Client_*fabric-*.xml"
        include "Minecraft_Server_*fabric-*.xml"
    }
}

tasks.register("syncIdeaRunConfigurations") {
    group = "ide"
    description = "Recreates IDEA run configurations for every configured Fabric target."
    dependsOn(fabricProjectPaths.collect { "${it}:ideaSyncTask" })
}

targets.each { minecraft, target ->
    project(":versions:fabric-${minecraft}") {
        ext.minecraftTarget = minecraft
        pluginManager.apply(target.remapped ? "net.fabricmc.fabric-loom-remap" : "net.fabricmc.fabric-loom")
        pluginManager.apply("maven-publish")
        apply from: rootProject.file("gradle/fabric-target.gradle")
    }
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds every supported Fabric target."
    dependsOn(fabricProjectPaths.collect { "${it}:build" })
}

tasks.register("collectModrinthArtifacts", Sync) {
    group = "build"
    description = "Collects one release jar per supported target for Modrinth."
    dependsOn(fabricProjectPaths.collect { "${it}:build" })
    into(layout.buildDirectory.dir("modrinth"))

    targets.each { targetName, target ->
        from(project(":versions:fabric-${targetName}").layout.buildDirectory.dir("libs")) {
            include "${archives_base_name}-${mod_version}+${target.minecraft}-fabric.jar"
        }
    }
}

tasks.named("buildAll") {
    dependsOn("collectModrinthArtifacts")
}

tasks.register("checkAll") {
    group = "verification"
    description = "Checks every supported Fabric target."
    dependsOn(fabricProjectPaths.collect { "${it}:check" })
}

tasks.named("build") {
    dependsOn("buildAll")
}

tasks.named("check") {
    dependsOn("checkAll")
}
