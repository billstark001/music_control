pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "music_control"

apply from: file("gradle/targets.gradle")

targets.keySet().each { minecraft ->
    def targetPath = ":versions:fabric-${minecraft}"
    include(targetPath)
    // Gradle 9 requires a project directory even when its build is configured centrally.
    project(targetPath).projectDir.mkdirs()
}
