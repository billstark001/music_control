name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft ${{ matrix.target.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - minecraft: 1.21.11
            module: versions:fabric-1.21.11
            java: "21"
            artifact: music-control-1.21.11
            jar: versions/fabric-1.21.11/build/libs/music_control-*+1.21.11-fabric.jar
          - minecraft: 26.1.2
            module: versions:fabric-26.1.2
            java: "25"
            artifact: music-control-26.1.2
            jar: versions/fabric-26.1.2/build/libs/music_control-*+26.1.2-fabric.jar
          - minecraft: "26.2"
            module: versions:fabric-26.2
            java: "25"
            artifact: music-control-26.2
            jar: versions/fabric-26.2/build/libs/music_control-*+26.2-fabric.jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :${{ matrix.target.module }}:build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target.artifact }}
          path: ${{ matrix.target.jar }}
          if-no-files-found: error
