def target = rootProject.ext.targets[project.ext.minecraftTarget]

group = rootProject.maven_group
version = "${rootProject.mod_version}+${target.minecraft}-fabric"

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    exclusiveContent {
        forRepositories(
            maven {
                name = "CottonMC-AlexIIL-staging"
                url = uri("https://staging.alexiil.uk/maven")
            },
            mavenCentral()
        )
        filter {
            includeGroup("io.github.cottonmc")
            includeGroup("io.github.juuxel")
            includeGroup("alexiil.mc.lib")
            includeGroup("alexiil.mc.mod")
        }
    }
    mavenCentral()
}

sourceSets {
    main {
        java.srcDirs = [
            rootProject.file("src/main/java"),
            rootProject.file("versions/shared-mc-${target.minecraft}/src/main/java"),
            project.file("src/main/java")
        ]
        resources.srcDirs = [
            rootProject.file("src/main/resources"),
            project.file("src/main/resources")
        ]
    }
    test {
        java.srcDirs = [rootProject.file("src/test/java")]
        resources.srcDirs = [rootProject.file("src/test/resources")]
    }
}

loom {
    accessWidenerPath = project.file("src/main/resources/music_control.accesswidener")
    mods {
        "music_control" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir = rootProject.file("run/fabric-${target.minecraft}").absolutePath
        }
        server {
            server()
            runDir = rootProject.file("run/server-fabric-${target.minecraft}").absolutePath
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    modImplementation "com.terraformersmc:modmenu:${target.modMenu}"

    modApi include("me.shedaniel.cloth:cloth-config-fabric:${target.clothConfig}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation include("io.github.cottonmc:LibGui:${target.libGui}")

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def resourceProperties = [
    version: project.version,
    minecraftRange: target.minecraftRange,
    javaVersion: target.javaVersion,
    mixinJava: target.mixinJava,
    loaderVersion: rootProject.loader_version,
    fabricApiVersion: target.fabricApiMin
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching("fabric.mod.json") { expand(resourceProperties) }
    filesMatching("music_control.mixins.json") { expand(resourceProperties) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = target.javaVersion
}

tasks.withType(Javadoc).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "file.encoding", "UTF-8"
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(target.javaVersion)
    sourceCompatibility = JavaVersion.toVersion(target.javaVersion)
    targetCompatibility = JavaVersion.toVersion(target.javaVersion)
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = rootProject.archives_base_name
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }
}
